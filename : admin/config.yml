backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Product Name"
        name: "title"
        widget: "string"
      - label: "Price (BDT)"
        name: "price"
        widget: "number"
      - label: "Weight"
        name: "weight"
        widget: "string"
      - label: "Product Image"
        name: "image"
        widget: "image"
      - label: "Description"
        name: "description"
        widget: "text"
